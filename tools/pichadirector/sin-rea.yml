# PICHADIRECTOR — perfil minimo para Groq (nivel gratuito, 8.000 tokens/min).
#
# LAS HERRAMIENTAS VIENEN DE DOS SITIOS y hay que apagar en los dos:
#
#   1. plugins del ARBOL      -> se apagan aqui abajo (id: tool-*)
#   2. plugins del PRESET     -> se reescribe preset-standard entero
#      (en el perfil web las herramientas del preset se MONTAN aparte, y
#       apagarlas por fuera no sirve: el preset las vuelve a montar)
#
# Medido con el espia (~/pichadirector/tools/groq-spy.mjs, modo stub):
#   sin tocar nada .......... 25 herramientas / 20.729 chars
#   solo tocar el preset .... 25 herramientas (no bajaba)
#   solo apagar el arbol ..... 2 herramientas /  2.847 chars
#   los dos .................. 2 herramientas esperadas (bash + nada mas)
#
# El REA se apaga AQUI porque ~/.dsh/cordis.patch.yml lo INSERTA para todos
# los perfiles y se aplica DESPUES de este archivo.

# --------------------------------------------------------------------------
# 1) EL PRESET: solo persona, instrucciones, hora y bash
# --------------------------------------------------------------------------
- id: preset-standard
  name: "@deepseek-ai/dsh-agent-preset"
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: "@deepseek-ai/dsh-persona"
        config:
          prefix: >-
            Eres pichadirector. NO programas y NO ejecutas cambios: escribes
            el prompt que otro agente (el ejecutor) va a correr. Respondes en
            espanol, corto y concreto. Tienes una sola herramienta, bash.
      - id: agent-instructions
        name: "@deepseek-ai/dsh-agent-instructions"
        config:
          maxBytes: 65536
      - id: time-context
        name: "@deepseek-ai/dsh-time-context"
      - id: tool-bash
        name: "@deepseek-ai/dsh-tool-bash"
        disabled: false

# --------------------------------------------------------------------------
# 2) EL ARBOL: apagar todo lo que no sea bash
# --------------------------------------------------------------------------
- id: tool-fs
