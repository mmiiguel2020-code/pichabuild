# Perfil "director": escribe prompts para que el agente ejecutor los corra.
# Usa Groq (gratis con clave) en vez de DeepSeek.

# modelo por defecto: Groq / qwen (responde directo, sin gastar tokens pensando)
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: groq
    model: qwen/qwen3.8-27b
    reasoningEffort: low

# ruta de Groq (compatible con OpenAI)
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      groq:
        apiKeyEnv: GROQ_API_KEY
        baseURL: https://api.groq.com/openai/v1

# OJO: el REA se apaga con el overlay ~/pichadirector/sin-rea.yml, no aqui.
# ~/.dsh/cordis.patch.yml inserta rea-mcp DESPUES de este archivo, asi que
# ponerlo aqui no sirve.

# cookie del navegador: 180 dias
- id: connection
  name: "@deepseek-ai/dsh-client-connection"
  config:
    cookieMaxAgeDays: 180
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
