[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pichabuild"
version = "1.0.0"
description = "pichabuilder 1.0 — afina, nombra y arma SoundFonts de 5 registros para acordeon"
requires-python = ">=3.10"
dependencies = ["numpy", "librosa"]

[project.scripts]
pichabuild = "pichabuild.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
